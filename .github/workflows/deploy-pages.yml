# GitHub Pages deployment for the OmniLingo landing site in /docs.
#
# Replaces the legacy auto-generated "Deploy from a branch" workflow, which
# stopped working after GitHub silently bumped its internal action to
# actions/deploy-pages@v5 — v5 requires `pages: write` and `id-token: write`
# permissions that the legacy auto-workflow never granted. Owning the workflow
# explicitly is the canonical fix.
#
# Pages → Source must be set to "GitHub Actions" (not "Deploy from a branch")
# for this workflow to publish.

name: Deploy GitHub Pages (docs/)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel any in-flight run if a new one starts.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
