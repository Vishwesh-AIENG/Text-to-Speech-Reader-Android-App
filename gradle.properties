org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
# org.gradle.java.home is intentionally not set here — each developer's JAVA_HOME
# (or ~/.gradle/gradle.properties override) provides it. A repo-wide hard-coded
# path breaks every machine that isn't the one it was authored on.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
